    .fab{display:none}.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease-out}.scrim.open{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);background:#fff;border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:10px 18px calc(18px + env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.2,.85,.3,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:36px;height:5px;background:#d1d1d6;border-radius:5px;margin:0 auto 8px}.modal-head{justify-content:space-between;margin-bottom:16px}.modal-head h2{font-size:18px;margin:0}.text-btn{border:0;background:none;color:var(--blue);padding:8px 0;font-weight:600}.danger{color:var(--red)}

    @media(max-width:700px){.shell{min-height:100dvh}.desktop-only{display:none}.fab{display:grid;place-items:center;position:fixed;z-index:25;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.18)}.fab svg{width:25px;stroke:currentColor;stroke-width:2;fill:none}.month-day{min-height:76px;padding:6px 2px}.mini-task{width:18px;height:4px;padding:0;color:transparent;margin-top:2px}.month-day.single-task .mini-task{width:100%;height:auto;padding:1px 4px;color:color-mix(in srgb,var(--day-color) 70%,black);font-size:10.5px;line-height:1.25;text-align:left}.task{grid-template-columns:52px 1fr auto;gap:9px}.time{font-size:12px}header,main{padding-left:14px;padding-right:14px}}

<body>
<!--
THESIS: 本周事项不是一摞卡片，而是一条可扫读、可完成、可分享的时间轨；拒绝通用仪表盘拼贴。
OWN-WORLD: 雪白日历纸、系统灰层级、日历红定位、类别色时间线；圆形日期和连续表格构成组件语言。
STORY: 用户先看到本周进度，再按天处理事项，随后切到月视图确认分布并分享。
FIRST VIEWPORT: 顶部为标题与分享动作，中段是七日日期带，首个选中日期下展开当天连续事项列表；移动端右下角固定新增按钮。
FORM: 移动日历工作台，用户指定的苹果日历参考优先；seed 6719efc7。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="shell">
  <header>
    <div class="topline">
      <div class="month-nav"><strong id="monthLabel"></strong></div>
      <div class="toolbar">
        <button class="icon-btn" id="exportBtn" aria-label="导出图片" title="导出图片"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 15v4h14v-4"/></svg></button>
        <button class="icon-btn" id="shareBtn" aria-label="复制分享链接" title="复制分享链接"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg></button>
        <button class="icon-btn add desktop-only" id="addBtn" aria-label="新增事项"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="navline">
      <div class="period-controls"><button class="period-btn" id="prevBtn" aria-label="上一个月或周"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><button class="period-btn" id="nextBtn" aria-label="下一个月或周"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div>
      <div class="view-switch" role="tablist" aria-label="日历视图"><button class="seg-btn active" role="tab" aria-selected="true" data-view="week">周</button><button class="seg-btn" role="tab" aria-selected="false" data-view="month">月</button></div>
    </div>
  </header>
  <main>
    <div class="stats"><span><b id="taskCount">0</b> 项安排</span><span><b id="doneCount">0</b> 项完成</span></div>
    <div class="progress"><i id="progressBar"></i></div>
    <section class="week-view" id="weekView">
      <div class="week-strip" id="weekStrip"></div>
      <div class="content-wrap"><div><div id="taskList"></div></div>
      </div>
    </section>
    <section class="month-view" id="monthView"><div class="weekday-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="month-grid" id="monthGrid"></div></section>
  </main>
</div>
<button class="fab" id="mobileAdd" aria-label="新增事项"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetTitle" inert>
  <div class="handle"></div><div class="modal-head"><button class="text-btn" id="cancelBtn">取消</button><h2 id="sheetTitle">新事项</h2><button class="text-btn" id="saveBtn">完成</button></div>
  <input type="hidden" id="taskId"><div class="field"><label for="titleInput">事项名称</label><input id="titleInput" maxlength="40" placeholder="例如：确认季度方案"></div>
  <div class="row"><div class="field"><label for="dateInput">日期</label><input id="dateInput" type="date"></div><div class="field"><label for="timeInput">时间</label><input id="timeInput" type="time"></div></div>
  <div class="field"><label>类别颜色</label><div class="colors" id="colors"></div></div>
  <div class="form-actions"><button class="text-btn danger" id="deleteBtn">删除事项</button><button class="primary-btn" id="savePrimary">保存</button></div>
</section>
<div class="toast" id="toast" role="status"></div>
<canvas id="exportCanvas" hidden></canvas>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], colors=['#007aff','#ff3b30','#ff9500','#34c759','#af52de'];
  const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}, add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x}, monday=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
  let weekStart=monday(new Date()), selected=iso(new Date()), activeColor=colors[0], view='week', lastFocused=null;
  const sample=()=>{const m=monday(new Date());return[
    {id:crypto.randomUUID(),title:'本周计划对齐',date:iso(m),time:'09:30',note:'产品与设计 · 会议室 A',color:colors[0],done:true},
    {id:crypto.randomUUID(),title:'确认季度方案',date:iso(add(m,1)),time:'10:00',note:'与业务负责人完成最终确认',color:colors[1],done:false},
    {id:crypto.randomUUID(),title:'客户回访整理',date:iso(add(m,2)),time:'14:30',note:'输出三条关键反馈',color:colors[2],done:false},
    {id:crypto.randomUUID(),title:'项目里程碑评审',date:iso(add(m,3)),time:'11:00',note:'线上会议 · 45 分钟',color:colors[4],done:false},
    {id:crypto.randomUUID(),title:'周报与下周预排',date:iso(add(m,4)),time:'16:30',note:'分享至项目群',color:colors[3],done:false}
  ]};
  let tasks=[];try{const q=new URLSearchParams(location.search).get('data');tasks=q?JSON.parse(decodeURIComponent(escape(atob(q)))):JSON.parse(localStorage.getItem('week-planner-tasks')||'null')||sample()}catch(e){tasks=sample()}
  const save=()=>{localStorage.setItem('week-planner-tasks',JSON.stringify(tasks));render()};
  const fmt=(d,opt)=>new Intl.DateTimeFormat('zh-CN',opt).format(d), inWeek=t=>{const d=new Date(t.date+'T12:00');return d>=weekStart&&d<add(weekStart,7)};
  function render(){
    const end=add(weekStart,6), wt=tasks.filter(inWeek), done=wt.filter(t=>t.done).length;
    $('#monthLabel').textContent=fmt(weekStart,{year:'numeric',month:'long'});
    $('#taskCount').textContent=wt.length;$('#doneCount').textContent=done;$('#progressBar').style.width=(wt.length?done/wt.length*100:0)+'%';
    $('#weekStrip').innerHTML=[0,1,2,3,4,5,6].map(i=>{const d=add(weekStart,i),id=iso(d),has=tasks.some(t=>t.date===id);return `<button class="day-tab ${id===selected?'selected':''} ${id===iso(new Date())?'today':''} ${has?'has-items':''}" data-date="${id}"><small>${'一二三四五六日'[i]}</small><span>${d.getDate()}</span></button>`}).join('');
    $$('.day-tab').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});
    const dayTasks=tasks.filter(t=>t.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
    $('#taskList').innerHTML=dayTasks.length?`<div class="task-list">${dayTasks.map(t=>`<article class="task ${t.done?'done':''}" data-id="${t.id}" style="--task-color:${t.color}" role="button" tabindex="0" aria-label="编辑事项：${esc(t.title)}"><div class="time">${t.time||'全天'}</div><div class="task-copy"><strong>${esc(t.title)}</strong></div><button class="check" aria-label="${t.done?'标记未完成':'标记完成'}"><svg viewBox="0 0 20 20"><path d="m4 10 4 4 8-9"/></svg></button></article>`).join('')}</div>`:`<div class="empty"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="m16 24 5 5 11-12"/></svg><h3>暂无事项</h3></div>`;
    $$('.task').forEach(el=>{const activate=e=>{const t=tasks.find(x=>x.id===el.dataset.id);if(e.target.closest('.check')){t.done=!t.done;save()}else openSheet(t)};el.onclick=activate;el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.check')){e.preventDefault();activate(e)}}});
    renderMonth();
  }
  function renderMonth(){const base=new Date(weekStart), first=new Date(base.getFullYear(),base.getMonth(),1,12), start=add(first,-((first.getDay()+6)%7));$('#monthGrid').innerHTML=Array.from({length:42},(_,i)=>{const d=add(start,i),id=iso(d),ds=tasks.filter(t=>t.date===id),outside=d.getMonth()!==first.getMonth(),single=ds.length===1;return `<button class="month-day ${outside?'outside':''} ${id===iso(new Date())?'today':''} ${single?'single-task':''}" style="${single?`--day-color:${ds[0].color}`:''}" data-date="${id}"><span class="num">${d.getDate()}</span>${ds.slice(0,3).map(t=>`<span class="mini-task" style="--mini-color:${t.color}">${esc(t.title)}</span>`).join('')}</button>`}).join('');$$('.month-day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;weekStart=monday(new Date(selected+'T12:00'));setView('week')})}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function labelColor(c){return ({'#007aff':'会议协作','#ff3b30':'关键事项','#ff9500':'跟进沟通','#34c759':'整理交付','#af52de':'评审决策'})[c]||'其他'}
  function setView(v){view=v;if(v==='month'){const d=new Date(selected+'T12:00');weekStart=new Date(d.getFullYear(),d.getMonth(),15,12)}else weekStart=monday(new Date(selected+'T12:00'));$('.shell').classList.toggle('month-mode',v==='month');$('#weekView').classList.toggle('hidden',v!=='week');$('#monthView').classList.toggle('active',v==='month');$$('.seg-btn').forEach(b=>{const active=b.dataset.view===v;b.classList.toggle('active',active);b.setAttribute('aria-selected',active)});render()}
  function movePeriod(delta){if(view==='month'){weekStart=new Date(weekStart.getFullYear(),weekStart.getMonth()+delta,15,12);selected=iso(new Date(weekStart.getFullYear(),weekStart.getMonth(),1,12))}else{weekStart=add(weekStart,delta*7);selected=iso(weekStart)}render()}
  function openSheet(t){lastFocused=document.activeElement;$('#sheetTitle').textContent=t?'编辑事项':'新事项';$('#taskId').value=t?.id||'';$('#titleInput').value=t?.title||'';$('#dateInput').value=t?.date||selected;$('#timeInput').value=t?.time||'09:00';activeColor=t?.color||colors[0];$('#deleteBtn').style.visibility=t?'visible':'hidden';renderColors();$('#sheet').inert=false;$('#sheet').setAttribute('aria-hidden','false');$('#scrim').classList.add('open');$('#sheet').classList.add('open');setTimeout(()=>$('#titleInput').focus(),180)}
  function closeSheet(){$('#scrim').classList.remove('open');$('#sheet').classList.remove('open');$('#sheet').inert=true;$('#sheet').setAttribute('aria-hidden','true');lastFocused?.focus?.()}
  function renderColors(){$('#colors').innerHTML=colors.map(c=>`<button type="button" class="color-radio ${c===activeColor?'active':''}" style="--c:${c}" data-color="${c}" aria-label="${labelColor(c)}"></button>`).join('');$$('.color-radio').forEach(b=>b.onclick=()=>{activeColor=b.dataset.color;renderColors()})}
  function commit(){const title=$('#titleInput').value.trim();if(!title){toast('请先填写事项名称');$('#titleInput').focus();return}const id=$('#taskId').value,obj={id:id||crypto.randomUUID(),title,date:$('#dateInput').value,time:$('#timeInput').value,color:activeColor,done:id?(tasks.find(t=>t.id===id)?.done||false):false};if(id)tasks=tasks.map(t=>t.id===id?obj:t);else tasks.push(obj);selected=obj.date;weekStart=monday(new Date(selected+'T12:00'));closeSheet();save();toast(id?'事项已更新':'事项已添加')}
  function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}
  async function share(){const data=btoa(unescape(encodeURIComponent(JSON.stringify(tasks)))),url=location.href.split('?')[0]+'?data='+encodeURIComponent(data);try{await navigator.clipboard.writeText(url);toast('分享链接已复制')}catch(e){prompt('复制这个分享链接',url)}}
  function mix(hex,amount){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgb(${Math.round(r*amount+255*(1-amount))},${Math.round(g*amount+255*(1-amount))},${Math.round(b*amount+255*(1-amount))})`}
  function exportImage(){
    const c=$('#exportCanvas'),ctx=c.getContext('2d'),scale=2,W=1080,H=1350;c.width=W*scale;c.height=H*scale;ctx.scale(scale,scale);ctx.fillStyle='#f5f5f7';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';round(ctx,40,40,1000,1270,28);ctx.fill();
    if(view==='month') exportMonth(ctx); else exportWeek(ctx);
    const a=document.createElement('a');a.download=view==='month'?`${weekStart.getFullYear()}年${weekStart.getMonth()+1}月事项.png`:`本周事项-${iso(weekStart)}.png`;a.href=c.toDataURL('image/png');a.click();toast('图片已导出')
  }
  function exportMonth(ctx){
    const first=new Date(weekStart.getFullYear(),weekStart.getMonth(),1,12),start=add(first,-((first.getDay()+6)%7)),left=72,top=182,gridW=936,cellW=gridW/7,cellH=158;
    ctx.fillStyle='#1d1d1f';ctx.font='650 36px "PingFang SC",-apple-system,sans-serif';ctx.textAlign='left';ctx.fillText(fmt(first,{year:'numeric',month:'long'}),left,98);
    ctx.font='550 18px "PingFang SC",-apple-system,sans-serif';ctx.fillStyle='#636366';ctx.textAlign='center';'一二三四五六日'.split('').forEach((x,i)=>ctx.fillText(x,left+cellW*i+cellW/2,top-27));
    for(let i=0;i<42;i++){
      const d=add(start,i),id=iso(d),ds=tasks.filter(t=>t.date===id),x=left+(i%7)*cellW,y=top+Math.floor(i/7)*cellH,out=d.getMonth()!==first.getMonth();
      if(ds.length===1){ctx.fillStyle=mix(ds[0].color,.16);ctx.fillRect(x,y,cellW,cellH)}else if(out){ctx.fillStyle='#fafafc';ctx.fillRect(x,y,cellW,cellH)}
      ctx.strokeStyle='#e5e5ea';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+cellW,y);ctx.stroke();
      if(id===iso(new Date())){ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.arc(x+cellW/2,y+30,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff'}else ctx.fillStyle=out?'#c7c7cc':'#1d1d1f';
      ctx.font='500 17px "SF Pro Text","PingFang SC",sans-serif';ctx.textAlign='center';ctx.fillText(String(d.getDate()),x+cellW/2,y+36);
      if(ds.length===1){ctx.fillStyle=mix(ds[0].color,.72);ctx.font='600 16px "PingFang SC",sans-serif';ctx.textAlign='left';wrapText(ctx,ds[0].title,x+10,y+70,cellW-20,23,3)}
      else ds.slice(0,3).forEach((t,j)=>{ctx.fillStyle=mix(t.color,.16);round(ctx,x+8,y+61+j*28,cellW-16,22,5);ctx.fill();ctx.fillStyle=mix(t.color,.76);ctx.font='600 13px "PingFang SC",sans-serif';ctx.textAlign='left';ctx.fillText(t.title.slice(0,9),x+14,y+77+j*28)})
    }
    ctx.strokeStyle='#e5e5ea';ctx.beginPath();ctx.moveTo(left,top+cellH*6);ctx.lineTo(left+gridW,top+cellH*6);ctx.stroke();
  }
  function exportWeek(ctx){
    const wt=tasks.filter(inWeek).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));ctx.fillStyle='#1d1d1f';ctx.font='650 36px "PingFang SC",-apple-system,sans-serif';ctx.textAlign='left';ctx.fillText(`${fmt(weekStart,{month:'long',day:'numeric'})} — ${fmt(add(weekStart,6),{month:'long',day:'numeric'})}`,82,105);ctx.fillStyle='#636366';ctx.font='500 21px "PingFang SC",sans-serif';ctx.fillText(`${wt.length} 项安排 · ${wt.filter(t=>t.done).length} 项完成`,82,145);let y=205;for(let i=0;i<7;i++){const d=add(weekStart,i),ds=wt.filter(t=>t.date===iso(d));ctx.fillStyle=iso(d)===iso(new Date())?'#ff3b30':'#1d1d1f';ctx.font='650 25px "PingFang SC",sans-serif';ctx.fillText(`${'一二三四五六日'[i]}  ${fmt(d,{month:'numeric',day:'numeric'})}`,82,y);y+=42;for(const t of ds){ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(94,y-8,5,0,Math.PI*2);ctx.fill();ctx.fillStyle=t.done?'#8e8e93':'#1d1d1f';ctx.font=`${t.done?'450':'600'} 23px "PingFang SC",sans-serif`;ctx.fillText(`${t.time||'全天'}  ${t.title}`,118,y);y+=42}ctx.strokeStyle='#e5e5ea';ctx.beginPath();ctx.moveTo(82,y);ctx.lineTo(998,y);ctx.stroke();y+=34}
  }
  function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){let line='',lines=0;for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y+lines*lineHeight);lines++;line=ch;if(lines===maxLines-1)break}else line=test}if(lines<maxLines)ctx.fillText(line,x,y+lines*lineHeight)}
  function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
  $('#addBtn').onclick=$('#mobileAdd').onclick=()=>openSheet();$('#cancelBtn').onclick=$('#scrim').onclick=closeSheet;$('#saveBtn').onclick=$('#savePrimary').onclick=commit;$('#deleteBtn').onclick=()=>{const id=$('#taskId').value;if(id&&confirm('删除这个事项？')){tasks=tasks.filter(t=>t.id!==id);closeSheet();save()}};$('#shareBtn').onclick=share;$('#exportBtn').onclick=exportImage;$('#prevBtn').onclick=()=>movePeriod(-1);$('#nextBtn').onclick=()=>movePeriod(1);$$('.seg-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#sheet').addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('#sheet button:not([style*="hidden"]),#sheet input,#sheet textarea').filter(x=>!x.disabled),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open'))closeSheet();if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&$('#sheet').classList.contains('open'))commit()});
  render();
})();
</script>
